# The information defined in this config is consistent across all devices of a type.

deviceConfig:
    cpe1:
        platform:   "vDevice"
        model:      "UK"
        soc_vendor: "intel"
        target_directory: "/tmp/"
        #kept for the process restart between the test cases
        vsink_process_name: "RDKVideoSinkAndPCService"
        vdecoder_process_name: "RDKVideoDecoderService"
        asink_process_name: "AudioSinkService"
        adecoder_process_name: "AudioDecoderService"
        process_path: "/usr/bin/" # path where the service files present
        AVBuffer_Restart: 0 # flag to restart avbuffer service
        prompt: "~#" # Prompt string on console
        test:
            #TODO: Use the single profile file which contains all details (ds, hdmi, etc)
            profile: "..\\..\\..\\profiles\\hfp-avmodule_vdevice.yaml"
            streams_download_url: "<URL_Path>" #URL path from which the streams are downloaded to the device