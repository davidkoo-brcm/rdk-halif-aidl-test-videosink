IVideoSinkManager:
  L3:
    Render_Sequential_FramesRepeatedFRC_NonTunnel:
      Controls:
        discardFramesUntilPts: -1
        underflow_pts: -1
        resumeTriggerPts: -1
        repeatPerFrame: 1
        flush_pts: 40000000
        flush_reset_pts: -1
        eos_pts: -1
        interFrameDelayMs: 0
        discontinuityPTS: -1
      Inputs:
        Streams:
          - Name: YCBCR444_720_480_10_1_hlg
            frameRate: 30
            PTS:
              - 0              # Frame 1
              - 66666666       # Frame 2 (approx double duration, will cause repeats)
              - 66666666       # Repeat Frame 2 again (exact same PTS to force repeat)
              - 133333332      # Frame 3
              - 133333332      # Repeat Frame 3
              - 200000000      # Frame 4
              - 266666666      # Frame 5
              - 266666666      # Repeat Frame 5
              - 333333332      # Frame 6
              - 333333332      # Repeat Frame 6
              - 400000000      # Frame 7