IVideoDecoderManager:
  L3:
    Render_Sequential_UnderflowResumed_NonTunnel:
      Controls:
        delay_between_decode_calls: 5 # Insert delay in msec between each `decodeBuffer()` call
      Inputs:
        Streams:
          - Codec: H264
            Name: H265_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734_UNDERFLOW
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_discardFramesUntilPts: -1
            sink_UnderflowCheck: false
            sink_underflow_pts: 133333332  # Will delay this PTS by 1s
            sink_resumeTriggerPts: 333333330
            sink_repeatPerFrame: 1
            sink_flush_pts: -1
            sink_flush_reset_pts: -1
            sink_eos_pts: -1
            sink_interFrameDelayMs: 0
            sink_discontinuityPTS: -1

