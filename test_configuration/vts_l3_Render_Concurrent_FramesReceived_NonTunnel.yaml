IVideoSinkManager:
  L3:
    Render_Concurrent_FramesReceived_NonTunnel:
      Controls:
        discardFramesUntilPts: -1
        underflow_pts: -1
        resumeTriggerPts: -1
        repeatPerFrame: 2
        flush_pts: -1
        flush_reset_pts: -1
        eos_pts: -1
        interFrameDelayMs: 0
        discontinuityPTS: -1
      Inputs:
        Streams:
          - Name: RGB_1280_720_10_0_hdr10
            frameRate: 60
            PTS:
              - 0           # Frame 1
              - 16666667    # Frame 2
              - 33333334    # Frame 3
              - 50000001    # Frame 4
              - 66666668    # Frame 5
              - 83333335    # Frame 6
              - 100000002   # Frame 7
