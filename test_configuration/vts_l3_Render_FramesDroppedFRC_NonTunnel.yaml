IVideoSinkManager:
  L3:
    Render_FramesDroppedFRC_NonTunnel:
      Controls:
        discardFramesUntilPts: -1
        underflow_pts: -1
        repeatPerFrame: 1
        flush_pts: 40000000
        flush_reset_pts: -1
        eos_pts: -1
        interFrameDelayMs: 0
        discontinuityPTS: -1
      Inputs:
        Streams:
          - Name: YCBCR444_1280_720_10_1_hdr10plus
            frameRate: 60
            PTS:
              - 8333333    # Regular 60 FPS
              - 16666666   # Regular
              - 25000000   # Regular
              - 25333333   # Sudden jump - reduced spacing
              - 25666666   # Even faster
              - 26000000   # Forces frame rate change
