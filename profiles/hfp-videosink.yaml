# HAL Feature Profile for videosink
profile: TV                     # String value TV or STB
hal version: 1.0.0              # String value
components:                     # Array of components
  - name: IVideoDecoderManager  # Component object begins
    interfaceVersion: 1         # Integer value
    supportedOperationalModes:
      - NON_TUNNELLED
      - TUNNELLED
    IVideoDecoder:              # Resource list
      - id: 0                   # Resource object begins
        supportedCodecs:        # Array of codec capabilities
          - codec: MPEG
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: H264
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: H265
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
          - codec: VP9
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
          - codec: AV1
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
        supportedDynamicRanges:
          - SDR
          - HLG
          - HDR10
          - DOLBY_VISION
        supportsSecure: true
      - id: 1
        supportedCodecs:        # Array of codec capabilities
          - codec: MPEG
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: H264
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: H265
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: VP9
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
          - codec: AV1
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
        supportedDynamicRanges:
          - SDR
        supportsSecure: true
  - name: IVideoSinkManager     # Component object begins
    interfaceVersion: 1         # Integer value
    IVideoSink:                 # Resource list
      - id: 0                   # Resource object begins
      - id: 1