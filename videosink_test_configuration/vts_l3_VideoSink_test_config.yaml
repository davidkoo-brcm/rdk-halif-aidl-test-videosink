include_0: videodecoder_test_configuration/vts_video_h264_streams.yaml
include_1: videodecoder_test_configuration/vts_video_hevc_streams.yaml
include_2: videodecoder_test_configuration/vts_video_vp9_streams.yaml
include_3: videodecoder_test_configuration/vts_video_av1_streams.yaml

videosink:
  stream_download_path: "http://<>/streams" #`URL` path to download the video test streams
  input_streams_path: "assets/streams/input" #Target path where input streams are stored
  reference_streams_path: "assets/streams/reference" #Target path for reference decoded streams
  L3: #Test Level
    Sink_Decode:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_734
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_MAIN10_1920x1080_DR_DOLBY_VISION_300NITS_BT2020_23976p_PIXEL_FORMAT_YCBCR420
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_COLORIMETRY
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_COLORIMETRY_NOSET
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_MDI
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_MDI_NOSET
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_CLL
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_HDR10_BT2020_30p_PIXEL_FORMAT_YCBCR420_CLL_NOSET
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
    Sink_EOS:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734_EOS
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_734_EOS
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
    Sink_Underflow:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: 83333000
    Sink_Flush:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734_FLUSH
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: H265_HEVC
            Name: H265_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_734_FLUSH
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
          - codec: VP9
            Name: VP9_HIGH_1920x1080_DR_SDR_DR_BT709_30p_PIXEL_FORMAT_YCBCR420_734_FLUSH
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
    Sink_DiscardFramesUntil:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: false # Enable backpressure to the sink
            sink_discardFramesUntilPts: 83333000
            frames_to_discard: 5
            sink_underflow_pts: -1
    Sink_BackPressure:
      Controls:
        delay_between_decode_calls: 1
      Inputs:
        Streams:
          - codec: H264_AVC
            Name: H264_HIGH_1920x1080_DR_SDR_DR_BT709_60p_PIXEL_FORMAT_YCBCR420_734
            rms_diff_threshold: 0.5
            decode_time_threshold: 10000000
            sink_backpressure: true # Enable backpressure to the sink
            sink_discardFramesUntilPts: -1
            sink_underflow_pts: -1
